name: Auto Update Tenders Daily
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python auto_update.py
        env:
          NEO_USER: ${{ secrets.NEO_USER }}
          NEO_PASS: ${{ secrets.NEO_PASS }}
      - run: |
          git config --global user.name "BS Bot"
          git config --global user.email "bot@bscompanies.co.za"
          git add tenders.json tenders.html
          git commit -m "Growing database - $(date)" || echo "No changes"
          git push
